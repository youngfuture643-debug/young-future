<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young Future | Universidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
    scroll-behavior: smooth;
}

body {
    background: #fafafa;
    color: #222;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
    z-index: 999;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
}

.logo img {
    height: 70px;
}

.logo h2 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
}

nav {
    display: flex;
    gap: 35px;
}

nav a {
    text-decoration: none;
    color: #222;
    font-weight: 500;
    transition: .3s;
}

nav a:hover {
    color: #1f5eff;
}

.hero {
    padding: 170px 8% 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 70px;
}

.hero h1 {
    font-size: 65px;
    line-height: 70px;
    margin: 20px 0;
    font-weight: 800;
}

.hero p {
    font-size: 20px;
    color: #666;
}

.hero button {
    margin-top: 35px;
    padding: 18px 45px;
    border: none;
    background: #1f5eff;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    transition: .3s;
}

.hero button:hover {
    transform: translateY(-4px);
}

.formulario {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .08);
}

.formulario h2 {
    margin-bottom: 25px;
}

.formulario input,
.formulario select {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
}

.formulario button {
    width: 100%;
    padding: 16px;
    background: #1f5eff;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

section {
    padding: 100px 8%;
}

.titulo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 60px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, .06);
    transition: .3s;
}

.card:hover {
    transform: translateY(-10px);
}

.card h3 {
    margin-bottom: 15px;
}

.card p {
    color: #666;
}

.search {
    width: 100%;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 18px;
    margin-bottom: 40px;
}

.universidad {
    background: white;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, .05);
}

.calculadoras {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
}

.calc {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .05);
    display: flex;
    flex-direction: column;
}

.calc input {
    width: 100%;
    padding: 15px;
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.calc button {
    width: 100%;
    padding: 15px;
    border: none;
    background: #1f5eff;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    margin-top: auto;
}

footer {
    background: #111;
    padding: 60px;
    text-align: center;
    color: white;
    margin-top: 100px;
}

footer img {
    height: 100px;
    margin-bottom: 20px;
}

.dark {
    background: #111;
    color: white;
}

.dark header {
    background: #111;
}

.dark nav a {
    color: white;
}

.dark .card,
.dark .calc,
.dark .formulario,
.dark .universidad {
    background: #1e1e1e;
    color: white;
}

.dark p {
    color: #ccc;
}

#chat {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #1f5eff;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 30px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
}

@media (max-width: 900px) {
    .hero {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 45px;
        line-height: 50px;
    }

    nav {
        display: none;
    }
}


    </style>
</head>

        <p>Construyendo el futuro de miles de jóvenes.</p>

        💬
    </div>
    <script>

const universidades = [
    { nombre: "Universidad Nacional de Colombia", pais: "Colombia", carrera: "Ingeniería" },
    { nombre: "Universidad de los Andes", pais: "Colombia", carrera: "Negocios" },
    { nombre: "Universidad Javeriana", pais: "Colombia", carrera: "Medicina" },
    { nombre: "Universidad del Rosario", pais: "Colombia", carrera: "Derecho" },
    { nombre: "Universidad EAFIT", pais: "Colombia", carrera: "Ingeniería" },
    { nombre: "Harvard University", pais: "Estados Unidos", carrera: "Negocios" },
    { nombre: "MIT", pais: "Estados Unidos", carrera: "Tecnología" },
    { nombre: "Stanford University", pais: "Estados Unidos", carrera: "Ingeniería" },
    { nombre: "University of Toronto", pais: "Canadá", carrera: "Ingeniería" },
    { nombre: "Universidad Complutense", pais: "España", carrera: "Derecho" }
];

const lista = document.getElementById("listaUniversidades");
const buscador = document.getElementById("buscarUniversidad");

function mostrarUniversidades() {
    if (!lista || !buscador) return;
    lista.innerHTML = "";
    const texto = buscador.value.toLowerCase();

    universidades
        .filter(u =>
            u.nombre.toLowerCase().includes(texto) ||
            u.pais.toLowerCase().includes(texto) ||
            u.carrera.toLowerCase().includes(texto)
        )
        .forEach(u => {
            lista.innerHTML += `
                <div class="card">
                    <h3>${u.nombre}</h3>
                    <p><b>País:</b> ${u.pais}</p>
                    <p><b>Carrera destacada:</b> ${u.carrera}</p>
                </div>
            `;
        });
}

if (lista && buscador) {
    mostrarUniversidades();
    buscador.addEventListener("keyup", mostrarUniversidades);
}

function calcularAhorro() {
    let ahorro = Number(document.getElementById("ahorroMensual").value);
    let meses = Number(document.getElementById("meses").value);
    document.getElementById("resultadoAhorro").innerHTML =
        "Total ahorrado: COP $" + (ahorro * meses).toLocaleString();
}

function calcularCarrera() {
    let semestre = Number(document.getElementById("valorSemestre").value);
    let cantidad = Number(document.getElementById("cantidadSemestres").value);
    document.getElementById("resultadoCarrera").innerHTML =
        "Costo aproximado: COP $" + (semestre * cantidad).toLocaleString();
}

function calcularInversion() {
    let capital = Number(document.getElementById("capital").value);
    let interes = Number(document.getElementById("interes").value) / 100;
    let anos = Number(document.getElementById("anos").value);
    let total = capital * Math.pow((1 + interes), anos);
    document.getElementById("resultadoInversion").innerHTML =
        "Valor futuro: COP $" + total.toFixed(2);
}

function recomendarCarrera() {
    const opcion = document.getElementById("vocacion").value;
    document.getElementById("resultadoVocacion").innerHTML =
        "Según tu interés, podrías estudiar <b>" + opcion + "</b>.";
}

    </script>
